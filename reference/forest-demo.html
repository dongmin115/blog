<title>일기장 테마 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=East+Sea+Dokdo&display=swap" rel="stylesheet">
<style>
/* Layout concept: 전체 화면 캔버스 위에 가장자리 UI만 얹는다. 상단에 테마 탭, 하단에 글 카드(사진, 좋아요, 조회수).
   2단계 구조: 카테고리 장면에서 고르고 그 안에서 글을 연다. 테마는 그리는 부분만 다르고 데이터와 UI는 공통.
   의도적으로 밤 단일 테마. */
:root {
  --bg: #03050f;
  --glow: #ffd98a;
  --ink: #ece8da;
  --ink-dim: #a9aec6;
  --panel: rgba(10, 16, 36, 0.95);
  --panel-edge: rgba(255, 217, 138, 0.22);
  --heart: #ffb3c6;
  --font-display: 'Gowun Batang', 'Nanum Myeongjo', 'Noto Serif KR', serif;
  --font-body: 'Gowun Dodum', 'Noto Sans KR', system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; touch-action: none;
}
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#scene:active { cursor: grabbing; }
.probe { position: absolute; visibility: hidden; padding-left: max(16px, env(safe-area-inset-left, 0px)); }

.top {
  position: fixed; left: 0; right: 0; top: 0;
  display: flex; flex-direction: column; gap: 10px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.brand { min-width: 0; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: 0.04em; text-shadow: 0 0 18px rgba(255, 217, 138, 0.25); }
.brand p { margin: 3px 0 0; font-size: 12px; color: var(--ink-dim); letter-spacing: 0.03em; }
.acts { display: flex; gap: 8px; flex: none; }
.btn {
  pointer-events: auto; font: inherit; font-size: 13px; color: var(--ink);
  min-height: 40px; padding: 0 16px; border-radius: 20px; cursor: pointer;
  background: rgba(10, 16, 36, 0.62); border: 1px solid rgba(236, 232, 218, 0.28);
  touch-action: manipulation;
}
.btn:hover { border-color: rgba(255, 217, 138, 0.6); }
.btn:disabled { opacity: 0.35; cursor: default; }
.btn:focus-visible, .item:focus-visible, .tab:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
.btn.like[aria-pressed="true"] { color: var(--heart); border-color: var(--heart); background: rgba(255, 179, 198, 0.12); }
.tabs { display: flex; gap: 6px; pointer-events: auto; }
.tab {
  flex: 1 1 0; min-width: 0; min-height: 38px; font: inherit; font-size: 13px; color: var(--ink-dim);
  background: rgba(10, 16, 36, 0.55); border: 1px solid rgba(236, 232, 218, 0.2); border-radius: 19px;
  cursor: pointer; touch-action: manipulation; padding: 0 4px;
}
.tab[aria-selected="true"] { color: var(--ink); border-color: rgba(255, 217, 138, 0.75); background: rgba(255, 217, 138, 0.13); }

.hint {
  position: fixed; left: 0; right: 0; text-align: center;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); padding: 0 16px;
  font-size: 13px; color: var(--ink-dim); letter-spacing: 0.03em; pointer-events: none; transition: opacity 0.5s ease;
}
.hint i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--glow); box-shadow: 0 0 10px 3px rgba(255, 217, 138, 0.6); margin-right: 8px; vertical-align: middle; }
.hint.gone { opacity: 0; }

.card {
  position: fixed; left: 0; right: 0; bottom: 0; max-height: 78%; overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain;
  padding-top: 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  background: linear-gradient(180deg, rgba(16, 25, 52, 0.96), var(--panel));
  border-top: 1px solid var(--panel-edge); border-radius: 22px 22px 0 0;
  box-shadow: 0 -14px 44px rgba(255, 217, 138, 0.07);
  transform: translateY(105%); visibility: hidden;
  transition: transform 0.38s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s linear 0.38s;
}
.card.open { transform: none; visibility: visible; transition: transform 0.38s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s; }
.card-in { max-width: 560px; margin: 0 auto; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-size: 12px; letter-spacing: 0.08em; color: var(--glow); }
.tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid rgba(169, 174, 198, 0.4); color: var(--ink-dim); letter-spacing: 0.04em; }
.card h2 { margin: 10px 0 10px; font-family: var(--font-display); font-weight: 700; font-size: 23px; line-height: 1.35; text-wrap: balance; }
.photo { display: block; width: 100%; height: min(28vh, 190px); object-fit: cover; border-radius: 14px; margin: 0 0 12px; background: #0b1226; }
.card p { margin: 0 0 14px; font-size: 15px; line-height: 1.75; color: #d6d4cb; max-width: 65ch; }
.note { margin: -4px 0 14px; font-size: 12px; color: var(--ink-dim); }
.stats { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 0 0 12px; font-size: 13px; color: var(--ink-dim); }
.stats .mini { font-size: 11px; opacity: 0.75; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row .spacer { flex: 1 1 0; }
#file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

.list {
  position: fixed; right: max(16px, env(safe-area-inset-right, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 58px);
  width: min(320px, calc(100vw - 32px)); max-height: 62%; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 16px; padding: 6px;
  touch-action: pan-y; overscroll-behavior: contain;
  opacity: 0; visibility: hidden; transform: translateY(-6px);
  transition: opacity 0.2s ease, transform 0.2s ease, visibility 0s linear 0.2s;
}
.list.open { opacity: 1; visibility: visible; transform: none; transition: opacity 0.2s ease, transform 0.2s ease, visibility 0s; }
.grp { display: flex; align-items: center; gap: 8px; padding: 12px 12px 4px; font-family: var(--font-display); font-weight: 700; font-size: 14px; }
.grp i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.grp span { margin-left: auto; font-family: var(--font-body); font-weight: 400; font-size: 11px; color: var(--ink-dim); }
.item { display: flex; gap: 12px; align-items: baseline; width: 100%; text-align: left; font: inherit; color: var(--ink); background: none; border: 0; padding: 10px 12px; border-radius: 10px; cursor: pointer; touch-action: manipulation; }
.item:hover { background: rgba(255, 217, 138, 0.09); }
.item .d { flex: none; width: 56px; font-size: 12px; color: var(--glow); letter-spacing: 0.04em; }
.item .t { font-family: var(--font-display); font-size: 15px; min-width: 0; }
@media (prefers-reduced-motion: reduce) { .card, .card.open, .list, .list.open, .hint { transition-duration: 0.01s; } }
</style>

<canvas id="scene" aria-label="일기 글이 카테고리별로 놓인 장면"></canvas>
<div class="probe" id="probe"></div>

<header class="top">
  <div class="bar">
    <div class="brand">
      <h1>일기장 테마 시안</h1>
      <p id="sub"></p>
    </div>
    <div class="acts">
      <button class="btn" id="back" type="button" hidden>‹ 전체</button>
      <button class="btn" id="listBtn" type="button" aria-expanded="false" aria-controls="list">목록</button>
    </div>
  </div>
  <div class="tabs" role="tablist" aria-label="테마">
    <button class="tab" role="tab" type="button" data-t="space">우주</button>
    <button class="tab" role="tab" type="button" data-t="stars">별자리</button>
    <button class="tab" role="tab" type="button" data-t="forest">반딧불 숲</button>
    <button class="tab" role="tab" type="button" data-t="library">도서관</button>
  </div>
</header>

<div class="list" id="list" role="menu" aria-label="카테고리별 글 목록"></div>
<div class="hint" id="hint"><i></i><span id="hintText"></span></div>

<section class="card" id="card" role="dialog" aria-label="글 미리보기" aria-hidden="true">
  <div class="card-in">
    <div class="meta"><span id="cDate"></span><span class="tag" id="cCat"></span><span class="tag">샘플</span><span class="tag" id="cPhotoTag" hidden>사진</span><span id="cRead"></span></div>
    <h2 id="cTitle"></h2>
    <img class="photo" id="cImg" alt="" hidden>
    <p id="cText"></p>
    <p class="note" id="cNote" hidden>고른 사진은 이 화면에서만 보이는 미리보기예요.</p>
    <div class="stats">
      <button class="btn like" id="like" type="button" aria-pressed="false">♡ <span id="likeN">0</span></button>
      <span id="viewN"></span>
      <span class="mini">샘플 수치예요. 이 화면에서만 바뀌어요.</span>
    </div>
    <div class="row">
      <button class="btn" id="prev" type="button">‹ 이전</button>
      <button class="btn" id="next" type="button">다음 ›</button>
      <button class="btn" id="photoBtn" type="button">사진 올려 보기</button>
      <span class="spacer"></span>
      <button class="btn" id="close" type="button">닫기</button>
    </div>
    <input id="file" type="file" accept="image/*" tabindex="-1" aria-hidden="true">
  </div>
</section>

  function fillCard(i) {
    var p = VIS[i], c = CATS[p.c];
    elDate.textContent = '2026 · ' + p.m + '월 ' + p.d + '일';
    elRead.textContent = p.r + '분 읽기';
    elCat.textContent = c.name;
    elCat.style.color = 'hsl(' + c.h + ',' + c.s + '%,75%)';
    elCat.style.borderColor = 'hsla(' + c.h + ',' + c.s + '%,70%,0.6)';
    elTitle.textContent = p.t; elText.textContent = p.x;
    if (p.src) { elImg.src = p.src; elImg.hidden = false; elTag.hidden = false; btnPhoto.textContent = '사진 바꾸기'; }
    else { elImg.removeAttribute('src'); elImg.hidden = true; elTag.hidden = true; btnPhoto.textContent = '사진 올려 보기'; }
    fillStats(p);
    btnPrev.disabled = i === 0; btnNext.disabled = i === VIS.length - 1;
  }
  function select(i) {
    if (cat < 0 || !VIS.length) return;
    i = clamp(i, 0, VIS.length - 1);
    if (sel !== i) elNote.hidden = true;
    sel = i;
    var p = VIS[i];
    if (!seen[p.id]) { seen[p.id] = true; p.v += 1; }
    var f = theme.focus(i);
    tcx = clamp(f[0], 0, W - vw); tcy = clamp(f[1], 0, H - vh); vx = vy = 0;
    fillCard(i);
    card.scrollTop = 0; card.classList.add('open'); card.setAttribute('aria-hidden', 'false');
    hideHint(); setList(false);
  }
  function closeCard() { sel = -1; card.classList.remove('open'); card.setAttribute('aria-hidden', 'true'); }
  function openPost(p) {
    var li = inCat(p.c).indexOf(p);
    if (cat === p.c) select(li); else goCat(p.c, function () { select(li); });
  }
  elLike.addEventListener('click', function () {
    if (sel < 0) return;
    var p = VIS[sel];
    if (liked[p.id]) delete liked[p.id]; else liked[p.id] = true;
    try { localStorage.setItem('dt-liked', JSON.stringify(liked)); } catch (e) { /* ignore */ }
    fillStats(p);
  });

  CATS.forEach(function (c, k) {
    var g = document.createElement('div'); g.className = 'grp';
    var dot = document.createElement('i'); dot.style.background = 'hsl(' + c.h + ',' + c.s + '%,65%)';
    var nm = document.createElement('b'); nm.textContent = c.name; nm.style.fontWeight = '700';
    var ct = document.createElement('span'); ct.textContent = inCat(k).length + '편';
    g.appendChild(dot); g.appendChild(nm); g.appendChild(ct); listEl.appendChild(g);
    inCat(k).forEach(function (p) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'item'; b.setAttribute('role', 'menuitem');
      var d = document.createElement('span'); d.className = 'd'; d.textContent = p.m + '월 ' + p.d + '일';
      var t = document.createElement('span'); t.className = 't'; t.textContent = p.t + (p.photo ? ' ◆' : '');
      b.appendChild(d); b.appendChild(t);
      b.addEventListener('click', function () { openPost(p); });
      listEl.appendChild(b);
    });
  });
  listBtn.addEventListener('click', function () { setList(!listEl.classList.contains('open')); hideHint(); });
  btnPrev.addEventListener('click', function () { if (sel > 0) select(sel - 1); });
  btnNext.addEventListener('click', function () { if (sel >= 0 && sel < VIS.length - 1) select(sel + 1); });
  document.getElementById('close').addEventListener('click', closeCard);
  btnPhoto.addEventListener('click', function () { fileIn.click(); });
  fileIn.addEventListener('change', function () {
    var f = fileIn.files && fileIn.files[0];
    if (!f || sel < 0) return;
    var url = URL.createObjectURL(f), img = new Image(), idx = sel, post = VIS[idx];
    img.onload = function () {
      setPhoto(post, img, img.naturalWidth, img.naturalHeight);
      URL.revokeObjectURL(url);
      themes[themeName].setup();
      if (sel === idx && VIS[idx] === post) { fillCard(idx); elNote.hidden = false; }
    };
    img.onerror = function () { URL.revokeObjectURL(url); };
    img.src = url; fileIn.value = '';
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (sel >= 0) closeCard(); else if (cat >= 0) goCat(-1); setList(false); }
    else if (e.key === 'ArrowLeft' && sel > 0) select(sel - 1);
    else if (e.key === 'ArrowRight' && sel >= 0 && sel < VIS.length - 1) select(sel + 1);
  });

  function hitTest(px, py) {
    var its = theme.items(), best = -1, bd = 1e9, i, it, d;
    for (i = 0; i < its.length; i++) {
      it = its[i];
      if (it.hw) {
        if (Math.abs(it.sx - px) < it.hw && Math.abs(it.sy - py) < it.hh) { d = Math.abs(it.sx - px); if (d < bd) { bd = d; best = i; } }
      } else {
        d = Math.hypot(it.sx - px, it.sy - py);
        if (d < (it.hr || 38) && d < bd) { bd = d; best = i; }
      }
    }
    return best;
  }
  function tap(px, py) {
    if (trans) return;
    var best = hitTest(px, py);
    if (cat < 0) { if (best >= 0) goCat(best); setList(false); return; }
    if (best >= 0) select(best);
    else { if (sel >= 0) closeCard(); setList(false); }
  }
  canvas.addEventListener('pointerdown', function (e) {
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, lt: e.timeStamp, moved: false };
    vx = vy = 0; tcx = tcy = null;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y, dtm = Math.max(1, e.timeStamp - drag.lt);
    drag.x = e.clientX; drag.y = e.clientY; drag.lt = e.timeStamp;
    if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6) { drag.moved = true; hideHint(); setList(false); }
    if (drag.moved) {
      var ys = theme.invertY ? -1 : 1;
      cx = clamp(cx - dx, 0, W - vw); cy = clamp(cy - dy * ys, 0, H - vh);
      vx = 0.8 * vx + 0.2 * (-dx / dtm); vy = 0.8 * vy + 0.2 * (-dy * ys / dtm);
    }
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var d = drag; drag = null;
    if (!d.moved) tap(e.clientX, e.clientY);
    else if (e.timeStamp - d.lt > 80) { vx = vy = 0; }
  });
  canvas.addEventListener('pointercancel', function () { drag = null; vx = vy = 0; });
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault(); tcx = tcy = null; hideHint();
    var dx = e.deltaX, dy = e.deltaY;
    if (H <= vh) { dx = dx || dy; dy = 0; }
    cx = clamp(cx + dx, 0, W - vw); cy = clamp(cy + dy * (theme.invertY ? -1 : 1), 0, H - vh);
  }, { passive: false });

  var rz = 0;
  window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { setup(false); }, 150); });

  /* ---------- start ---------- */
  useTheme(location.hash.replace('#', ''), true);
  raf = requestAnimationFrame(frame);
})();
</script>
