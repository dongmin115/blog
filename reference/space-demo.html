  /* ================= core ================= */

    $('mdate').textContent = p.m + '월 ' + p.d + '일'; $('mread').textContent = '· ' + p.r + '분';
    $('mtitle').textContent = p.t; $('mtext').textContent = p.x; $('mviews').textContent = '조회 ' + (p.v + 1);

    if (p.photo) { ph.hidden = false; ph.getContext('2d').drawImage(paintPhoto(p.photo, 184, 138), 0, 0); } else ph.hidden = true;
