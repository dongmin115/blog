<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03040c">
<title>블로그</title>
<meta name="description" content="살면서 느끼고 생각한 것들의 기록">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<div id="stage"></div>
<div class="top">
  <div class="head">
    <div class="brand"><b id="brand">블로그</b><span id="sub"></span></div>
    <button class="btn" id="back" hidden>‹ 전체</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div>
<div class="hint" id="hint"></div>
<div class="card" id="card">
  <div class="sheet">
    <div class="meta"><span class="chip" id="mcat"></span><span id="mdate"></span><span id="mread"></span></div>
    <h2 id="mtitle"></h2>
    <div class="body"><p id="mtext"></p><img id="photo" alt="" hidden></div>
    <div class="row">
      <div class="stats"><span id="mviews"></span></div>
      <div class="acts">
        <button class="like" id="mlike">♡ 0</button>
        <a class="btn" id="mread-link" href="#">전체 읽기</a>
        <button class="btn" id="mclose">닫기</button>
      </div>
    </div>
  </div>
</div>
<div class="nogl" id="nogl" hidden><span id="noglmsg"></span></div>
<script type="module" src="./app.js"></script>
</body>
</html>
